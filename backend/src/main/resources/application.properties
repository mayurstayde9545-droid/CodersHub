# ---- MySQL connection: change user/password here, or set DB_USER / DB_PASSWORD / DB_URL env vars ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartgroup?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# creates the tables from schema.sql on startup (safe to re-run)
spring.sql.init.mode=always
server.port=8080
