# ---- MySQL connection: change user/password here, or set DB_USER / DB_PASSWORD / DB_URL env vars ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartgroup?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# creates the tables from schema.sql on startup (safe to re-run)
spring.sql.init.mode=always
server.port=8080
# Email verification and one-time welcome/project summary email. Supply these as environment variables.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:}
